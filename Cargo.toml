[package]
name = "lenscast"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["gnome_50"] }
gdk = { version = "0.11", package = "gdk4" }
gdk-pixbuf = "0.22"
adw = { version = "0.9", package = "libadwaita", features = ["gtk_v4_22", "v1_4"] }
glib = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "6"
async-channel = "2.5.0"
rand = "0.9"

mdns-sd = "0.13"
qrcode = "0.14"
flume = "0.11"
gstreamer = "0.22"
gstreamer-app = "0.22"
gstreamer-video = "0.22"

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
ksni = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"